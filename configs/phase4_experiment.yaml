  description: "Tỷ lệ câu trả lời có trích dẫn được chứng minh là có dữ kiện hỗ trợ trong đoạn trích nguồn."
  preset_pass_fail_threshold: null # Khong dat nguong pass/fail truoc khi co ket qua thuc nghiem
  evaluation_protocol:
    automated_judge:
      tool: "local_judge"
      method: "Kiem tra do bao phu tu khoa va entailing overlap giua cau tra loi va doan trich dan"
    human_audit:
      sample_size: 100
      method: "Kiem tra mu thu cong (blind manual verification) tren 100 mau kiem thu ngau nhien"

