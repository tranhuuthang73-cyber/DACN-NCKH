  no_phase3_1_in_training: true

# ------------------------------------------------------------------------------
# AUDIT SECTION 5: REFUSAL FAIRNESS SPECIFICATION (TASK 4)
# ------------------------------------------------------------------------------
refusal_fairness:
  disentanglement_principles:
    retrieval_relevance:
      metric: "Raw BM25 lexical score (s_BM25)"
      threshold: 3.0
      description: "Measures lexical query-passage overlap, NOT factual truth or completeness."
    evidence_sufficiency:
      criteria:
        - "Score threshold: s_BM25 >= 3.0"
        - "Passage count: N_evidence >= 1"
        - "Query coverage: coverage >= 0.35"
        - "Flag: has_sufficient_evidence == True"
      description: "Measures whether retrieved evidence meets information sufficiency criteria."
    refusal_decision:
      controller: "RefusalController"
      rules:
        - "If evidence is sufficient -> ANSWER"
        - "If N_passages == 0 -> REFUSAL (reason: no_relevant_evidence_found)"
        - "If max_score < 3.0 -> REFUSAL (reason: evidence_below_confidence_threshold)"
        - "If coverage < 0.35 or count < 1 -> REFUSAL (reason: insufficient_evidence_coverage)"
  evaluation_taxonomy:
    correct_refusal: "Ground truth is Unanswerable or Insufficient Evidence, and pipeline emits REFUSAL"
    false_refusal: "Ground truth is Answerable, but pipeline emits REFUSAL"
    false_answer: "Ground truth is Unanswerable or Insufficient Evidence, but pipeline attempts to ANSWER; OR Answerable but generated answer is incorrect/unsupported"
    insufficient_evidence_refusal: "Refusal specifically triggered by insufficient coverage or low confidence despite partial retrieval"

# ------------------------------------------------------------------------------
# TASK 5: STATISTICAL EVALUATION PROTOCOL
# ------------------------------------------------------------------------------
statistics:
  seeds: [42, 43, 44]
  summary_aggregations: ["mean", "std", "ci_95_bootstrap"]
  bootstrap:
    method: "non_parametric_percentile"
    iterations: 1000
    confidence_level: 0.95
    resampling_unit: "individual_evaluation_item" # Strictly NOT over the 3 seed means!
  hypothesis_testing:
    p1_vs_b5_comparison:
      paired_sample: true
      tests:
        - "paired_students_t_test"
        - "wilcoxon_signed_rank_test"
      alpha_threshold: 0.05
      effect_size_metric: "cohens_d"

# ------------------------------------------------------------------------------
# TASK 7: CONTROLLED BUDGET CONSTRAINTS
# ------------------------------------------------------------------------------
controlled_budget:
  target_event_source: "P1_SA_CMS" # B5 and Random Boundary match P1 update count exactly
  enforce_strict_equality: true
  tolerance_delta_updates: 0
  log_update_events: true
  logged_attributes:
    - "level_index"
    - "boundary_type"
    - "token_position"
    - "step_norm"
    - "timescale"

# ------------------------------------------------------------------------------
# FROZEN HYPERPARAMETERS
# ------------------------------------------------------------------------------
hyperparameters:
  sa_cms:
    num_levels: 3
    level_names: ["Paragraph", "Section", "Document"]
    inner_learning_rates:
      level_1: 0.01   # Fast timescale (Paragraph)
      level_2: 0.005  # Medium timescale (Section)
      level_3: 0.001  # Slow timescale (Document)
    aggregation: "gated" # Eq 74
    single_level_b4_lr: 0.01
    fixed_token_b5_lrs: [0.01, 0.005, 0.001]
    fixed_token_chunk_sizes: [64, 128, 256]

  retrieval_bm25:
    k1: 1.5
    b: 0.75
    passage_chunk_size: 256
    passage_chunk_overlap: 32
    top_k: 5
    score_threshold: 3.0 # Calibrated via CAND_07

  refusal_controller:
    score_threshold: 3.0 # Aligned with calibrated BM25
    min_evidence_score: 3.0
    min_evidence_count: 1
    min_query_coverage: 0.35
    thresholds_frozen: true

  generation:
    max_answer_tokens: 64
    temperature: 0.0 # Greedy decoding for determinism and reproducibility
    repetition_penalty: 1.1

