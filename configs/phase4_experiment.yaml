meta:
  protocol_version: "4.0.2-final-fairness-lock"
  freeze_date: "2026-10-03"
  project: "Chatbot hoi dap tren tai lieu voi bo nho da thang dua tren Nested Learning"
  status: "READY_FOR_PHASE_4_1"
  runner_override_prohibited: true

# ------------------------------------------------------------------------------
# MANDATORY PHASE 4.0.2 LOCKED TRAINING & RETRIEVAL SPECIFICATION
# ------------------------------------------------------------------------------
training:
  final_training_samples: 200
  corpus_documents: 20
  token_budget_per_epoch: 21905
  total_epochs: 3
  total_tokens: 65715
  optimizer: "AdamW"
  learning_rate: 0.0001
  batch_size: 4
  gradient_accumulation_steps: 1
  precision: "float16"
  seeds: [42, 43, 44]
  status: "LOCKED_BENCHMARK_TRAINING_SIZE"
  runner_override_prohibited: true

retrieval:
  bm25_k1: 1.5
  bm25_b: 0.75
  top_k: 5
  score_threshold: 3.0
  chunk_size: 256
  chunk_overlap: 32
  evidence_selector:
    max_evidence: 5
    min_evidence: 1
    score_threshold: 3.0
  refusal_controller:
    min_evidence_score: 3.0
    min_evidence_count: 1
    min_query_coverage: 0.35
  runner_override_prohibited: true

shared_retrieval_for_b2_p2: true
runner_override_prohibited: true

# ------------------------------------------------------------------------------
# TASK 1: SEVEN BENCHMARK METHODS
# ------------------------------------------------------------------------------
methods:
  B1:
    name: "ICL Full-Document Context"
    category: "baseline"
    description: "In-context learning with the full document concatenated into the prompt context window. Original paper reference baseline."
    mode: "context"
    requires_online_update: false
    context_eviction: false
    retrieval_augmented: false
    memory_levels: 0

  B2:
    name: "Standard BM25 RAG"
    category: "baseline"
    description: "Industry-standard Retrieval-Augmented Generation using BM25 passage retrieval. Top-k passages placed in prompt context."
    mode: "hybrid" # uses retrieval without parametric memory updates
    requires_online_update: false
    context_eviction: true # raw document evicted, only retrieved passages present
    retrieval_augmented: true
    memory_levels: 0

  B3:
    name: "Cartridges / Context Compression"
    category: "baseline"
    description: "Self-study lightweight representation via offline prompt generation and adapter baking (Eyuboglu et al., arXiv:2506.06266)."
    reproducible_in_budget: false
    status_note: "not reproducible within controlled budget (4GB VRAM / single GPU constraint; requires heavy offline distillation and large teacher compute)"
    requires_substitute: false # Strictly prohibited from substituting

  B4:
    name: "Single-Level Adapter"
    category: "baseline"
    description: "Non-multi-timescale parametric memory. Single-level MLP adapter updated via Equation 71 upon reading document. Context evicted."
    mode: "memory"
    requires_online_update: true
    context_eviction: true
    retrieval_augmented: false
    memory_levels: 1

  B5:
    name: "Fixed-Token CMS (Hope-Attention Scaled)"
    category: "baseline"
    description: "Fixed-token Continuum Memory System from Nested Learning (arXiv:2512.24695v1, Eq 70-71). k=3 levels updated at fixed token chunk intervals. Context evicted."
    mode: "memory"
    schedule_mode: "fixed_token"
    requires_online_update: true
    context_eviction: true
    retrieval_augmented: false
    memory_levels: 3

  P1:
    name: "SA-CMS Memory-Only (Proposed)"
    category: "proposed"
    description: "Structure-Aligned CMS across 3 hierarchy levels (Paragraph, Section, Document). Context evicted during QA. Parametric memory only."
    mode: "memory"
    schedule_mode: "structure"
    requires_online_update: true
    context_eviction: true
    retrieval_augmented: false
    memory_levels: 3

  P2:
    name: "SA-CMS + Retrieval Hybrid (Proposed)"
    category: "proposed"
    description: "Proposed hybrid architecture: SA-CMS 3-level parametric memory + BM25 passage retrieval + EvidenceSelector + RefusalController + Citation grounding."
    mode: "hybrid"
    schedule_mode: "structure"
    requires_online_update: true
    context_eviction: true # full text evicted; retrieved evidence passages provided in prompt
    retrieval_augmented: true
    memory_levels: 3

ablations:
  A1_random_boundary:
    name: "CMS Level 3 Random Boundary"
    description: "Control experiment isolating syntactic boundary value from variable chunk length effect. Same total update count as P1."
    schedule_mode: "random"
    memory_levels: 3
  A2_two_levels:
    name: "SA-CMS Level 2 (Paragraph + Section)"
    description: "Evaluates depth effect by disabling Level 3 (Document Memory)."
    memory_levels: 2
  A3_no_gating:
    name: "SA-CMS Additive (No Learned Gates)"
    description: "Evaluates learned gate aggregation vs simple addition in Equation 74."
    aggregation: "additive"
  A4_self_study_toggle:
    name: "Self-Study Question-Answer Memory Toggle"
    description: "Evaluates impact of self-generated QA updates on Level 2/3 adapters."
    self_study_enabled: false
  A5_adapter_rank:
    name: "Adapter Rank Exploration"
    description: "Evaluates rank variants r in [8, 16, 32]."
    candidate_ranks: [8, 16, 32]
  A6_top_k_layers:
    name: "Top-K Updated Layers Exploration"
    description: "Evaluates updating top-K transformer blocks vs output continuum blocks."
    candidate_k_layers: [2, 4, "all"]

# ------------------------------------------------------------------------------
# TASK 2: HARDWARE & MODEL FAIRNESS PROTOCOL
# ------------------------------------------------------------------------------
hardware_fairness:
  backbone_model: "HuggingFaceTB/SmolLM2-135M"
  tokenizer: "HuggingFaceTB/SmolLM2-135M"
  frozen_backbone: true
  total_backbone_parameters: 134515008
  max_context_window: 512
  precision_gpu: "float16"
  precision_cpu: "float32"
  primary_device: "cuda"
  fallback_device: "cpu"
  target_gpu_hardware: "NVIDIA GeForce GTX 1650 Ti (4GB VRAM)"
  max_vram_budget_mb: 3500
  document_preprocessor: "DocumentStructureParser"
  text_normalizer: "NFKC_clean_whitespace"
  evaluation_question_matching: "strict_identical_items"

# Mandatory Differences Matrix:
mandatory_differences:
  B1:
    prompt_contains: "full_document_text"
    parametric_updates: 0
    test_context_tokens: "up_to_512"
  B2:
    prompt_contains: "top_k_retrieved_passages"
    parametric_updates: 0
    test_context_tokens: "passage_budget (~256 tokens)"
  B4:
    prompt_contains: "query_only (context evicted)"
    parametric_updates: "online gradient updates (level 1 only)"
    test_context_tokens: "query_tokens (<64)"
  B5:
    prompt_contains: "query_only (context evicted)"
    parametric_updates: "online gradient updates (3 fixed token levels)"
    test_context_tokens: "query_tokens (<64)"
  P1:
    prompt_contains: "query_only (context evicted)"
    parametric_updates: "online gradient updates (3 structure-aligned levels)"
    test_context_tokens: "query_tokens (<64)"
  P2:
    prompt_contains: "top_k_retrieved_passages + query"
    parametric_updates: "online gradient updates (3 structure-aligned levels)"
    test_context_tokens: "passage_budget + query (~300 tokens)"

# ------------------------------------------------------------------------------
# TASK 3: PRIMARY RESEARCH QUESTIONS (FROZEN)
# ------------------------------------------------------------------------------
research_questions:
  RQ1:
    title: "Multi-level CMS Reproduction at Student Scale"
    text: "CMS nhiều mức có tái hiện được xu hướng trên QASPER/MK-NIAH ở quy mô nhỏ không?"
    hypothesis: "Nhiều mức hơn cho kết quả tốt hơn một mức trên LongHealth/QASPER/MK-NIAH."
    key_comparison: "B5 vs B4 vs B1"
  RQ2:
    title: "Structure-Aligned vs Fixed-Token Budget-Controlled Comparison"
    text: "P1 SA-CMS có khác B5 Fixed Token khi cùng update budget không?"
    hypothesis: "Lịch căn theo cấu trúc đạt kết quả tốt hơn lịch token cố định ở cùng số lần cập nhật."
    key_comparison: "P1 vs B5 (paired statistical test)"
  RQ3:
    title: "Post-Eviction Retention & Faithfulness"
    text: "Sau khi document rời context: memory-only và hybrid retrieval hoạt động thế nào? P2 có cải thiện faithfulness so với B2 không?"
    hypothesis: "Bản lai P2 đạt độ trung thực cao nhất, khắc phục hiện tượng hallucination của memory-only P1."
    key_comparison: "P2 vs B2 vs P1"
  RQ4:
    title: "Continual Ingestion Catastrophic Forgetting"
    text: "Sequential document ingestion gây forgetting bao nhiêu?"
    hypothesis: "SA-CMS đa mức duy trì biểu diễn bền vững hơn adapter một mức B4 sau khi nạp thêm 5, 10, 20 tài liệu."
    key_comparison: "P1 vs B4 across sequential document intervals"
  RQ5:
    title: "Computational and Memory Cost Profile"
    text: "Cost của memory-based methods so với RAG/context dài?"
    hypothesis: "Nạp tài liệu tốn thời gian hơn RAG, nhưng mỗi câu trả lời tiết kiệm token và có độ trễ suy luận ổn định."
    key_comparison: "Ingest cost, answer tokens, latency, VRAM across all methods"

# ------------------------------------------------------------------------------
# TASK 4: PRIMARY METRICS SPECIFICATION
# ------------------------------------------------------------------------------
metrics:
  answer_quality:
    - name: "token_f1"
      definition: "Token-level harmonic mean of precision and recall against ground truth answers."
      benchmark: "QASPER / Vietnamese QA"
    - name: "exact_match"
      definition: "Binary indicator (1.0 or 0.0) of exact string identity after normalization."
      benchmark: "QASPER / Vietnamese QA"
    - name: "mkniah_accuracy"
      definition: "Multi-key retrieval accuracy on needle codes embedded across haystack."
      benchmark: "MK-NIAH"
    - name: "target_token_probability"
      definition: "Softmax probability assigned to correct target token under greedy evaluation."
      benchmark: "MK-NIAH / QASPER"

  faithfulness:
    - name: "citation_support_rate"
      definition: "Proportion of generated claims with citations where cited passage directly contains the supporting fact."
      target: null # NO PRESET PASS/FAIL THRESHOLD (AUDIT TASK 1)
    - name: "local_judge_score"
      definition: "Lexical & semantic NLI overlap score between answer and retrieved evidence passages."
    - name: "manual_verification_sample_size"
      definition: "Blind human audit sample size across randomly selected test outputs."
      value: 100

  refusal:
    - name: "correct_refusal_rate"
      definition: "Percentage of Unanswerable and Insufficient Evidence queries correctly refused."
      target_corpus: "Unanswerable (10) + Insufficient Evidence (10)"
    - name: "false_refusal_rate"
      definition: "Percentage of Answerable queries erroneously refused."
      target_corpus: "Answerable (20)"

  forgetting:
    - name: "retention_accuracy_intervals"
      definition: "Accuracy on initial document D_0 evaluated after sequentially ingesting +N documents."
      evaluation_points: [5, 10, 20]

  cost:
    - name: "ingest_time_per_1k_tokens_sec"
      definition: "Wall-clock seconds required to perform forward-backward ingestion per 1000 tokens."
    - name: "answer_tokens_generated"
      definition: "Average output token count per question."
    - name: "latency_ms_per_query"
      definition: "Total end-to-end response time in milliseconds per query."
    - name: "peak_vram_mb"
      definition: "Maximum GPU memory allocated during ingestion and query execution."
    - name: "checkpoint_size_mb"
      definition: "Disk storage footprint of saved memory snapshot state_dict."

